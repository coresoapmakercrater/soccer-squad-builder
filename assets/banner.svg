<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f16"/>
      <stop offset="45%" stop-color="#0f2a1c"/>
      <stop offset="100%" stop-color="#081018"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e5f3c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b1f16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow)"/>

  <!-- Pitch-inspired decorative lines, low opacity, behind text safe area -->
  <g stroke="#ffffff" stroke-opacity="0.08" fill="none">
    <line x1="600" y1="0" x2="600" y2="360" stroke-width="2"/>
    <circle cx="600" cy="180" r="70" stroke-width="2"/>
    <circle cx="600" cy="180" r="3" fill="#ffffff" fill-opacity="0.08" stroke="none"/>
    <path d="M0,0 A80,80 0 0,1 80,0" stroke-width="2"/>
    <path d="M1200,0 A80,80 0 0,0 1120,0" stroke-width="2"/>
    <path d="M0,360 A80,80 0 0,0 80,360" stroke-width="2"/>
    <path d="M1200,360 A80,80 0 0,1 1120,360" stroke-width="2"/>
  </g>

  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="150" cy="80" r="40"/>
    <circle cx="1050" cy="290" r="55"/>
    <circle cx="1000" cy="60" r="18"/>
    <circle cx="120" cy="300" r="22"/>
  </g>

  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="54.0" fill="#ffffff" font-weight="600">
    <tspan x="600" dy="0">Build Soccer Squad Script</tspan>
  </text>

  <text x="600" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Small Windows tool for Sunday-league managers —</tspan>
    <tspan x="600" dy="28">build a soccer squad script that sorts players into positions…</tspan>
  </text>
</svg>